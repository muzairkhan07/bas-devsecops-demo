# DevSecOps demo pipeline (GitHub Actions version of azure-pipelines.yml)
# Save as: .github/workflows/devsecops-demo.yml in a new PUBLIC repo
# Scans OWASP Juice Shop (deliberately vulnerable open-source app)

name: DevSecOps Demo - BAS

on:
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: "Enforce security gate (untick only for an approved security exception)"
        type: booleanaaa
        default: true

permissions:
  contents: read
  security-events: write

env:
  APP_IMAGE: bkimminich/juice-shop:latest

jobs:
  # ------------------------------------------------------------ 1. BUILD & SCAN
  scan:
    name: "1. Security Scans + Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: app
          fetch-depth: 1

      - name: Prepare report folder
        run: mkdir -p reports && chmod 777 reports

      - name: Secrets scan (Gitleaks)
        run: |
          docker run --rm -v "$PWD/app:/repo" -v "$PWD/reports:/out" \
            zricethezav/gitleaks:latest detect --source /repo --no-git --no-banner \
            --report-format sarif --report-path /out/gitleaks.sarif --exit-code 0

      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$PWD/app:/src" -v "$PWD/reports:/out" \
            semgrep/semgrep semgrep scan --metrics off \
            --config p/javascript --config p/typescript \
            --sarif --output /out/semgrep.sarif /src || true

      - name: SCA, licence check & SBOM (Trivy)
        run: |
          docker run --rm -v "$PWD/reports:/out" aquasec/trivy:latest \
            image --scanners vuln,license --format table --output /out/sca-report.txt $APP_IMAGE
          docker run --rm -v "$PWD/reports:/out" aquasec/trivy:latest \
            image --scanners vuln --format sarif --output /out/trivy.sarif $APP_IMAGE
          docker run --rm -v "$PWD/reports:/out" aquasec/trivy:latest \
            image --format cyclonedx --output /out/sbom.cdx.json $APP_IMAGE
          echo "---- CRITICAL / HIGH summary ----"
          docker run --rm aquasec/trivy:latest image --scanners vuln \
            --severity CRITICAL,HIGH --format table $APP_IMAGE | tail -n 40

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      - name: Publish SAST findings to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep.sarif
          category: sast-semgrep

      - name: SECURITY GATE (secrets = 0, critical = 0)
        if: ${{ inputs.enforce_gate }}
        run: |
          set +e
          docker run --rm -v "$PWD/app:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --no-banner --exit-code 1 > /dev/null 2>&1
          SECRETS=$?
          docker run --rm aquasec/trivy:latest image --scanners vuln \
            --severity CRITICAL --exit-code 1 --quiet $APP_IMAGE > /dev/null 2>&1
          CRITICAL=$?
          echo "Hardcoded secrets found: $([ $SECRETS -ne 0 ] && echo YES || echo no)"
          echo "Critical vulnerabilities found: $([ $CRITICAL -ne 0 ] && echo YES || echo no)"
          if [ $SECRETS -ne 0 ] || [ $CRITICAL -ne 0 ]; then
            echo "::error::SECURITY GATE FAILED - build blocked from UAT/Production"
            exit 1
          fi
          echo "Security gate passed"

  # ------------------------------------------------------------ 2. UAT + DAST
  uat:
    name: "2. Deploy to UAT + DAST"
    needs: scan
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Deploy application (test environment)
        run: |
          docker run -d --name juice -p 3000:3000 $APP_IMAGE
          for i in $(seq 1 40); do curl -sf http://localhost:3000 > /dev/null && break; sleep 5; done
          echo "App is up on the test environment"

      - name: DAST (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 -r zap-report.html -I

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap/

  # ------------------------------------------------------------ 3. PRODUCTION
  production:
    name: "3. Production (manual approval)"
    needs: uat
    runs-on: ubuntu-latest
    environment: production   # Settings > Environments > production > Required reviewers
    steps:
      - name: Deploy to Production
        run: echo "Approved release ${{ github.run_number }} (commit ${{ github.sha }}) deployed to Production"
